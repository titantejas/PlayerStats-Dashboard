version: "3.8"
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
  api:
    build: ./backend
    ports: ["4000:4000"]
    environment:
      - MONGO_URI=mongodb://mongo:27017/playerstats
      - JWT_SECRET=change-me
      - PORT=4000
      - CLIENT_URL=http://localhost:5173
    depends_on: [mongo]
  web:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  mongo-data:
